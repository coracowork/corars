name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: corars
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag name
        id: metadata
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          version="${TAG#v}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: corars
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: corars
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: corars
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: corars
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: corars.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: corars.exe
            cross: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross (Unix)
        if: matrix.cross == true && runner.os != 'Windows'
        run: cargo install cross --force

      - name: Install cross (Windows)
        if: matrix.cross == true && runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cross --force
          # Adiciona o diretório do cargo ao PATH para esta sessão
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          # Verifica instalação
          cargo cross --version

      - name: Fix MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --target ${{ matrix.target }} --release -p cora-cli

      - name: Build with cross (Unix)
        if: matrix.cross == true && runner.os != 'Windows'
        run: cross build --target ${{ matrix.target }} --release -p cora-cli

      - name: Build with cross (Windows)
        if: matrix.cross == true && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Adiciona o diretório do cargo ao PATH para esta sessão
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          # Usa cargo cross (subcomando do cargo)
          cargo cross build --target ${{ matrix.target }} --release -p cora-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          mkdir -p dist
          ARCHIVE="CoraRS-${TAG}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "CoraRS-${env:TAG}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate per-file checksums
        shell: bash
        run: |
          cd artifacts
          for f in CoraRS-*; do
            if [[ -f "$f" ]]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          sha256sum CoraRS-* > corars-checksums.txt

      - name: Create release body
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          cat > release_body.md << 'EOF'
          ## CoraRS ${TAG}

          ### Plataformas suportadas
          | Target | Plataforma |
          |--------|------------|
          | `x86_64-unknown-linux-gnu` | Linux x86_64 |
          | `aarch64-unknown-linux-gnu` | Linux ARM64 |
          | `x86_64-apple-darwin` | macOS x86_64 |
          | `aarch64-apple-darwin` | macOS ARM64 |
          | `x86_64-pc-windows-msvc` | Windows x86_64 |
          | `aarch64-pc-windows-msvc` | Windows ARM64 |

          ### Checksums
          Os arquivos `.sha256` estão disponíveis para cada artefato.

          ### Instalação rápida
          **Linux/macOS:**
          ```bash
          tar xzf CoraRS-${TAG}-<target>.tar.gz
          chmod +x corars
          sudo mv corars /usr/local/bin/